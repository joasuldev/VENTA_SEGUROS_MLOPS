# docker-compose.yml — Levanta la API de predicción en un contenedor (patrón Unidad 05)
# Uso en Codespace: docker compose up --build   → puerto 8000 (/docs para Swagger)
#
# La UI de MLflow NO va en Docker: es una herramienta de desarrollo (no de producción)
# y se levanta con el entorno del proyecto, igual que en la Unidad 06:
#   mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5000 \
#     --allowed-hosts "localhost:*,127.0.0.1:*,*.app.github.dev"
# (Se probó un contenedor de MLflow, pero instalaba MLflow al ARRANCAR y fallaba sin red;
#  la API, en cambio, instala sus librerías durante el BUILD.)
services:
  api:
    build: .
    container_name: seguro-antirrobos-api
    ports:
      - "8000:8000"
    restart: unless-stopped
